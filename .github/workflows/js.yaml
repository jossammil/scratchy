# Unit tests for the browser code, and a check that the committed editor
# bundle is what the sources build.
name: js

on:
  push:
    branches: [main, codex/panels]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srcjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: srcjs/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Committed bundle matches the sources
        run: |
          npm run build
          git status --porcelain -- ../inst/htmlwidgets/lib ../inst/js ../inst/stickers
          git diff --exit-code -- ../inst/htmlwidgets/lib ../inst/js ../inst/stickers
          test -z "$(git status --porcelain -- ../inst/htmlwidgets/lib ../inst/js ../inst/stickers)"

  e2e:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: srcjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: srcjs/package-lock.json
      - run: |
          npm ci
          npx playwright install chromium webkit
      - name: Build the site
        run: npm run site
      - name: Chromium
        run: |
          npm run e2e
          npm run e2e:workspace
          npm run e2e:projects
      - name: WebKit (Safari engine)
        run: |
          BROWSER=webkit npm run e2e
          BROWSER=webkit npm run e2e:workspace
          BROWSER=webkit npm run e2e:projects
